[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uhi-project"
version = "0.1.0"
description = "42-City Urban Heat Island Analysis and Temperature Prediction Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Atharv Kumar", email = "svisatharv@gmail.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "PyYAML>=6.0.1",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "shap>=0.45.0",
    "plotly>=5.19.0",
    "pydeck>=0.8.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
